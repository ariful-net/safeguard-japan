spring:
  application:
    name: safeguard-japan

  # 既定は組み込み H2（MariaDB 互換モード）。起動時に db/01〜03 の SQL を読み込む。
  # アプリは参照だけなので、外部 DB なしで Render などにそのまま置ける。
  # MariaDB を使うときは --spring.profiles.active=mariadb
  datasource:
    url: 'jdbc:h2:mem:safeguard;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS safeguard\;SET SCHEMA safeguard'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/01_schema.sql
      data-locations: classpath:db/02_data_shelters.sql,classpath:db/03_data_phrases.sql

  # 多言語メッセージ messages_ja/en/bn/vi.properties
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # 災害時のアクセス集中対策: 取得結果を60秒保持
  cache:
    type: caffeine
    cache-names: alerts,weather
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s

  thymeleaf:
    cache: true

  mvc:
    format:
      date-time: iso

server:
  # Render などは PORT 環境変数でポートを渡す
  port: ${PORT:8080}
  # リバースプロキシ（HTTPS 終端）の X-Forwarded-* を信頼する
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 本番は HTTPS 必須（Geolocation API と Service Worker は HTTPS でしか動かない）
  # localhost は例外として HTTP でも動く

mybatis:
  mapper-locations: classpath:mapper/*.xml

app:
  http:
    timeout-ms: 3000
  jma:
    quake-list-url: https://www.jma.go.jp/bosai/quake/data/list.json
  weather:
    base-url: https://api.open-meteo.com/v1/forecast
  # GPS 拒否時のデフォルト位置（大阪駅）
  default-location:
    lat: 34.7025
    lon: 135.4959

logging:
  level:
    root: INFO
    # リクエストのクエリ文字列（緯度経度）をログに出さない
    org.springframework.web: WARN

---
# ローカルの MariaDB を使う（db/ の SQL を README の手順で投入しておく）
# アプリ用DBユーザーは SELECT 権限のみ（db/00_create_database_and_user.sql）
spring:
  config:
    activate:
      on-profile: mariadb
  datasource:
    url: jdbc:mariadb://localhost:3306/safeguard?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:safeguard_app}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: never
